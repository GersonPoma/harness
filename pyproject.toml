[project]
name = "harness"
version = "0.1.0"
description = "Harness de IA por consola para generación de código"
readme = "README.md"
authors = [
    { name = "Gerson Enrique Villarroel Poma", email = "villarroelpoma2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "openai>=3.34.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
